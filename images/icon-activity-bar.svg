<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    VS Code uses this SVG as a CSS mask-image: only the alpha channel matters.
    Opaque pixels  → theme colour (visible)
    Transparent    → invisible (background shows through)

    Strategy: one compound path with fill-rule="evenodd".
    The outer head+ears shape is drawn first (clockwise),
    then the eye ellipses are sub-paths (counter-clockwise).
    Because evenodd counts boundary crossings, the eye regions
    (enclosed twice) become transparent holes — visible as "eyes"
    against whatever background colour VS Code paints behind the icon.
  -->
  <path
    fill="#424242"
    fill-rule="evenodd"
    d="
      M 28,5
      L 10,55
      C 6,63 6,72 6,74
      C 6,90 26,97 50,97
      C 74,97 94,90 94,74
      C 94,72 94,63 90,55
      L 72,5
      L 61,36
      C 58,34 54,33 50,33
      C 46,33 42,34 39,36
      Z
      M 41,62 A 8.5,9.5 0 1,0 24.001,62 A 8.5,9.5 0 1,0 41,62 Z
      M 76,62 A 8.5,9.5 0 1,0 59.001,62 A 8.5,9.5 0 1,0 76,62 Z
    "
  />
</svg>
